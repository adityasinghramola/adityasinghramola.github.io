media:
  input: public/images
  output: /images

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: '{fields.title}.md'
    view:
      fields: [title, category, date]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: category
        label: Section
        type: select
        required: true
        options:
          values:
            - value: code
              label: Code & games
            - value: art
              label: Art
            - value: finance
              label: Finance
      - name: date
        label: Date
        type: date
        required: true
      - name: status
        label: Status
        type: select
        options:
          values:
            - value: in-progress
              label: In progress
            - value: done
              label: Done
        default: in-progress
      - name: tags
        label: Tags
        type: string
        list: true
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            type: string
          - name: url
            type: string
      - name: cover
        label: Image (needed for every Art entry to show the gallery)
        type: image
      - name: coverAlt
        label: Image description
        type: string
      - name: draft
        label: Hide (draft)
        type: boolean
        default: false
      - name: body
        label: Write-up
        type: rich-text
